[package]
name = "music-royalty"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib alongside cdylib so the crate can be linked into a test harness; a
# cdylib-only crate cannot be unit tested.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.6"

[dev-dependencies]
soroban-sdk = { version = "21.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
